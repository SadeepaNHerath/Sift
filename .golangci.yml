version: "2"
run:
  modules-download-mode: readonly

linters:
  enable:
    - cyclop
    - gocyclo
    - errcheck
    - ineffassign
    - staticcheck
    - misspell
    - unconvert
    - govet
  settings:
    cyclop:
      max-complexity: 50
    errcheck:
      check-type-assertions: true
    gocyclo:
      min-complexity: 50
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - cyclop
          - errcheck
          - gocyclo
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$

formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
