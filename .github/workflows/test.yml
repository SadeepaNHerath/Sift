name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Go Test & Build
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Verify Formatting
        run: |
          diff -u <(echo -n) <(gofmt -d .)

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Tests with Race Detector
        run: go test -v -race ./...

      - name: Build Binary
        run: make build

      - name: Verify Binary
        run: |
          ./bin/sf --version
          ./bin/sf --help
