<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" width="100%" height="100%" style="background:transparent;">
  <defs>
    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes sceneCycle {
        0%, 30% { opacity: 1; visibility: visible; }
        33%, 97% { opacity: 0; visibility: hidden; }
        100% { opacity: 1; visibility: visible; }
      }
      @keyframes scene2Cycle {
        0%, 31% { opacity: 0; visibility: hidden; }
        35%, 65% { opacity: 1; visibility: visible; }
        68%, 100% { opacity: 0; visibility: hidden; }
      }
      @keyframes scene3Cycle {
        0%, 66% { opacity: 0; visibility: hidden; }
        70%, 96% { opacity: 1; visibility: visible; }
        99%, 100% { opacity: 0; visibility: hidden; }
      }
      .font-mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 13px;
        line-height: 19px;
      }
      .cursor {
        animation: blink 0.9s infinite;
      }
      .scene-1 {
        animation: sceneCycle 12s infinite;
      }
      .scene-2 {
        animation: scene2Cycle 12s infinite;
      }
      .scene-3 {
        animation: scene3Cycle 12s infinite;
      }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Terminal Window Chrome -->
  <g filter="url(#shadow)">
    <!-- Window Background -->
    <rect x="20" y="20" width="800" height="440" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

    <!-- Window Header -->
    <path d="M 20 30 Q 20 20 30 20 L 810 20 Q 820 20 820 30 L 820 54 L 20 54 Z" fill="#161b22"/>
    <line x1="20" y1="54" x2="820" y2="54" stroke="#30363d" stroke-width="1"/>

    <!-- macOS Traffic Light Buttons -->
    <circle cx="42" cy="37" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
    <circle cx="62" cy="37" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
    <circle cx="82" cy="37" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

    <!-- Window Title -->
    <text x="420" y="41" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500">sadeepa@macbook ~ sf</text>
  </g>

  <!-- SCENE 1: sf doctor (0s - 4s) -->
  <g class="scene-1 font-mono">
    <!-- Prompt -->
    <text x="44" y="86" fill="#3fb950" font-weight="bold">➜</text>
    <text x="62" y="86" fill="#58a6ff" font-weight="bold">~</text>
    <text x="78" y="86" fill="#c9d1d9" font-weight="bold">sf doctor</text>

    <!-- Header -->
    <text x="44" y="116" fill="#58a6ff" font-weight="bold">🩺 Sift System Doctor</text>
    <text x="44" y="134" fill="#30363d">──────────────────────────────────────────────────────────────────────────</text>

    <!-- Health Checks -->
    <text x="44" y="156" fill="#3fb950">  ✔ OK      </text>
    <text x="140" y="156" fill="#f0f6fc">Memory Pressure     </text>
    <text x="320" y="156" fill="#8b949e">Memory pressure normal (Health Score: 92/100)</text>

    <text x="44" y="180" fill="#3fb950">  ✔ OK      </text>
    <text x="140" y="180" fill="#f0f6fc">User Caches         </text>
    <text x="320" y="180" fill="#8b949e">User caches are healthy (1.4 GB)</text>

    <text x="44" y="204" fill="#d29922">  ▲ WARNING </text>
    <text x="140" y="204" fill="#f0f6fc">Orphaned Leftovers  </text>
    <text x="320" y="204" fill="#8b949e">Found 18 leftover items (4.2 GB) from removed apps</text>

    <text x="44" y="228" fill="#3fb950">  ✔ OK      </text>
    <text x="140" y="228" fill="#f0f6fc">Touch ID for Sudo   </text>
    <text x="320" y="228" fill="#8b949e">Touch ID authentication for sudo is enabled</text>

    <text x="44" y="250" fill="#30363d">──────────────────────────────────────────────────────────────────────────</text>

    <!-- Summary Box -->
    <text x="44" y="274" fill="#58a6ff">Diagnostics summary:</text>
    <text x="210" y="274" fill="#3fb950">3 healthy</text>
    <text x="280" y="274" fill="#8b949e">│</text>
    <text x="295" y="274" fill="#d29922">1 warning</text>
    <text x="375" y="274" fill="#8b949e">│</text>
    <text x="390" y="274" fill="#8b949e">0 critical</text>

    <!-- Recommendation -->
    <text x="44" y="304" fill="#8b949e">Recommended Action: run </text>
    <text x="235" y="304" fill="#79c0ff" font-weight="bold">sf clean</text>
    <text x="300" y="304" fill="#8b949e"> to reclaim orphaned leftover caches</text>

    <!-- Blinking Cursor -->
    <rect x="44" y="330" width="8" height="15" fill="#58a6ff" class="cursor"/>
  </g>

  <!-- SCENE 2: sf dedup --clone (4s - 8s) -->
  <g class="scene-2 font-mono">
    <!-- Prompt -->
    <text x="44" y="86" fill="#3fb950" font-weight="bold">➜</text>
    <text x="62" y="86" fill="#58a6ff" font-weight="bold">~</text>
    <text x="78" y="86" fill="#c9d1d9" font-weight="bold">sf dedup --clone ~/Downloads</text>

    <!-- Output -->
    <text x="44" y="114" fill="#58a6ff">▸ Sift: Scanning directories for duplicate files...</text>
    <text x="44" y="138" fill="#f0f6fc" font-weight="bold">Set #1 (48.2 MB each • 3 files • 96.4 MB reclaimable via APFS CoW)</text>

    <text x="60" y="162" fill="#3fb950" font-weight="bold">[KEEP] </text>
    <text x="120" y="162" fill="#c9d1d9">~/Downloads/macOS_Wallpapers.pkg</text>
    <text x="420" y="162" fill="#8b949e">(2026-10-12 14:20)</text>

    <text x="60" y="186" fill="#58a6ff" font-weight="bold">[CLONE]</text>
    <text x="120" y="186" fill="#c9d1d9">~/Downloads/macOS_Wallpapers_copy.pkg</text>
    <text x="420" y="186" fill="#8b949e">(2026-10-14 09:15)</text>

    <text x="60" y="210" fill="#58a6ff" font-weight="bold">[CLONE]</text>
    <text x="120" y="210" fill="#c9d1d9">~/Downloads/Archive/Wallpapers_v2.pkg</text>
    <text x="420" y="210" fill="#8b949e">(2026-10-14 11:42)</text>

    <text x="44" y="234" fill="#30363d">──────────────────────────────────────────────────────────────────────────</text>

    <!-- Success Box -->
    <rect x="44" y="248" width="732" height="72" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
    <text x="64" y="274" fill="#3fb950" font-weight="bold">✔ APFS Copy-on-Write Deduplication completed! Reclaimed 96.4 MB</text>
    <text x="64" y="294" fill="#8b949e">  Deduplicated 2 duplicate files (zero file loss)</text>
    <text x="64" y="310" fill="#58a6ff">  Storage blocks are now shared via APFS Copy-on-Write. Both files remain independently mutable.</text>

    <!-- Blinking Cursor -->
    <rect x="44" y="340" width="8" height="15" fill="#58a6ff" class="cursor"/>
  </g>

  <!-- SCENE 3: Interactive TUI Dashboard (8s - 12s) -->
  <g class="scene-3 font-mono">
    <!-- Prompt -->
    <text x="44" y="86" fill="#3fb950" font-weight="bold">➜</text>
    <text x="62" y="86" fill="#58a6ff" font-weight="bold">~</text>
    <text x="78" y="86" fill="#c9d1d9" font-weight="bold">sf</text>

    <!-- TUI Header Border -->
    <rect x="44" y="104" width="732" height="236" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.2"/>

    <!-- TUI Title Bar -->
    <text x="64" y="128" fill="#ff7b72" font-weight="bold">SIFT</text>
    <text x="100" y="128" fill="#f0f6fc"> (sf) v2.2.0 — macOS Terminal Maintenance &amp; Disk Toolkit</text>

    <!-- Metrics Sparklines -->
    <text x="64" y="156" fill="#8b949e">CPU Usage: </text>
    <text x="145" y="156" fill="#3fb950" font-weight="bold"> ▂▃▅█▅▃▂ </text>
    <text x="235" y="156" fill="#f0f6fc">18.4% (8 Cores)</text>

    <text x="420" y="156" fill="#8b949e">Memory: </text>
    <text x="480" y="156" fill="#3fb950" font-weight="bold">███████░░░</text>
    <text x="575" y="156" fill="#f0f6fc">9.4 / 16.0 GB (58%)</text>

    <text x="64" y="176" fill="#30363d">────────────────────────────────────────────────────────────────────────</text>

    <!-- Menu Items -->
    <text x="64" y="200" fill="#58a6ff" font-weight="bold">▸ [1] Clean System Caches &amp; AI Models    </text>
    <text x="430" y="200" fill="#8b949e">Reclaim user, dev, &amp; LLM blobs</text>

    <text x="64" y="222" fill="#c9d1d9">  [2] Uninstall Application              </text>
    <text x="430" y="222" fill="#8b949e">Zero-leftover smart removal</text>

    <text x="64" y="244" fill="#c9d1d9">  [3] APFS Deduplicator (CoW Clones)     </text>
    <text x="430" y="244" fill="#8b949e">Instant space reclaim without file loss</text>

    <text x="64" y="266" fill="#c9d1d9">  [4] Interactive Disk Analyzer          </text>
    <text x="430" y="266" fill="#8b949e">Drill-down storage visualizer</text>

    <text x="64" y="288" fill="#c9d1d9">  [5] System Health &amp; Diagnostics Doctor </text>
    <text x="430" y="288" fill="#8b949e">Hardware, launchd, &amp; FDA checks</text>

    <!-- TUI Footer Navigation -->
    <rect x="44" y="306" width="732" height="34" rx="0" fill="#0d1117"/>
    <text x="64" y="326" fill="#8b949e">Navigation: </text>
    <text x="145" y="326" fill="#58a6ff">↑/k</text>
    <text x="175" y="326" fill="#8b949e"> up  •  </text>
    <text x="215" y="326" fill="#58a6ff">↓/j</text>
    <text x="245" y="326" fill="#8b949e"> down  •  </text>
    <text x="295" y="326" fill="#58a6ff">Enter</text>
    <text x="340" y="326" fill="#8b949e"> select  •  </text>
    <text x="400" y="326" fill="#58a6ff">q</text>
    <text x="415" y="326" fill="#8b949e"> quit</text>
  </g>
</svg>
