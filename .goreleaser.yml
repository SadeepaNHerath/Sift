version: 2

project_name: Spacefold

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: sf
    main: ./cmd/sf
    binary: sf
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - arm64
      - amd64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - install.sh

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  github:
    owner: SadeepaNHerath
    name: Sift
  prerelease: auto
  header: |
    ## Sift (sf) {{ .Tag }}
    Terminal-first macOS maintenance, cleanup, and disk analysis toolkit.

    ### Installation via Homebrew (Recommended)
    ```bash
    brew tap SadeepaNHerath/tap
    brew install sf
    ```

    ### Direct Shell Install
    ```bash
    curl -fsSL https://raw.githubusercontent.com/SadeepaNHerath/Sift/main/install.sh | bash
    ```

brews:
  - name: sf
    repository:
      owner: SadeepaNHerath
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew formula update for Sift (sf) version {{ .Tag }}"
    homepage: "https://github.com/SadeepaNHerath/Sift"
    description: "Terminal-first macOS maintenance, app uninstaller, and disk analysis toolkit"
    license: "MIT"
    install: |
      bin.install "sf"
      generate_completions_from_executable(bin/"sf", "completion")
    caveats: |
      Sift (sf) requires non-root user execution. Never run with sudo sf.
      Elevate privileges with Touch ID via:
        sf touchid enable
    test: |
      assert_match "Sift (sf)", shell_output("#{bin}/sf --help")
